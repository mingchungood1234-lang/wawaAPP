# nginx site for the WhatsApp mobile app.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/whatsapp
#   (replace chat.example.com below with your domain)
#   sudo ln -s /etc/nginx/sites-available/whatsapp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chat.example.com     # adds HTTPS + redirect to this file

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    client_max_body_size 64m;              # file uploads

    location / {
        proxy_pass http://127.0.0.1:3000;  # match APP_PORT in .env if you changed it
        proxy_http_version 1.1;

        # WebSocket (live messages)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # lets the app set secure cookies
    }
}
